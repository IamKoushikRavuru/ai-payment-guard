services:
  - type: web
    name: ai-payment-guard-backend
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./payment_guard.db"
      - key: SYNC_DATABASE_URL
        value: "sqlite:///./payment_guard.db"
      - key: AI_PROVIDER
        value: "mock"
