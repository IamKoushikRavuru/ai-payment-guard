services:
  - type: web
    name: ai-payment-guard-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: HOST
        value: "0.0.0.0"
      - key: LOG_LEVEL
        value: "INFO"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./payment_guard.db"
      - key: SYNC_DATABASE_URL
        value: "sqlite:///./payment_guard.db"
      - key: AI_PROVIDER
        value: "mock"
